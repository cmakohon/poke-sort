name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mault.xyz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'packages/web/**'
              - 'packages/shared/**'
              - 'Dockerfile.web'
            server:
              - 'packages/server/**'
              - 'packages/shared/**'
              - 'drizzle/**'
              - 'Dockerfile.server'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trigger Coolify deployment (web)
        if: steps.changes.outputs.web == 'true'
        run: |
          curl -sf --request GET "${{ secrets.COOLIFY_WEBHOOK_WEB }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Trigger Coolify deployment (server)
        if: steps.changes.outputs.server == 'true'
        run: |
          curl -sf --request GET "${{ secrets.COOLIFY_WEBHOOK_SERVER }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Notify Discord (success)
        if: success()
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Magic Vault deployed - v${{ steps.version.outputs.version }}\",
                \"description\": \"Version bumped.${{ steps.changes.outputs.web == 'true' && ' Web redeployed.' || '' }}${{ steps.changes.outputs.server == 'true' && ' Server redeployed.' || '' }}\",
                \"color\": 5763719,
                \"url\": \"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\",
                \"fields\": [
                  { \"name\": \"Commit\", \"value\": \"[\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\", \"inline\": true },
                  { \"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true }
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}

      - name: Notify Discord (failure)
        if: failure()
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Magic Vault deploy failed\",
                \"description\": \"The deploy workflow failed on master. Check the run log.\",
                \"color\": 15548997,
                \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"fields\": [
                  { \"name\": \"Commit\", \"value\": \"[\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})\", \"inline\": true },
                  { \"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true }
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
