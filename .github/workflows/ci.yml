name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck server
        run: pnpm --filter @poke-sort/server exec tsc --noEmit -p tsconfig.json

      - name: Typecheck desktop
        run: pnpm --filter @poke-sort/desktop exec tsc --noEmit -p tsconfig.json

      - name: Lint
        run: pnpm lint

      # Nothing ran these until now, so a change could break the reranker and
      # still go green — which is exactly how the seam-right band shipped with
      # two false accepts on the real set. eval/real-set.test.ts replays the
      # committed signals snapshot through the production reranker and fails on
      # a false accept or a per-era top-1 drop. eval/accuracy.test.ts stays
      # excluded: it needs the catalog database and the model weights.
      - name: Test
        run: |
          pnpm --filter @poke-sort/server test
          pnpm --filter @poke-sort/web test

      # `tsc -b` runs as part of the web build.
      - name: Build
        run: pnpm build
