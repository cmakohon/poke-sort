name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build server and web
        run: pnpm build

      # ~100 MB of SigLIP weights, bundled rather than downloaded on first run:
      # offline operation is the point of the app. Cached because it is the
      # slowest step and the model is pinned.
      - name: Cache SigLIP weights
        uses: actions/cache@v4
        with:
          path: .models
          key: siglip-base-patch16-512-q8-v1

      - name: Fetch model weights
        run: node packages/desktop/scripts/fetch-model.mjs

      - name: Package
        run: pnpm --filter @magic-vault/desktop dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
            packages/desktop/release/*.AppImage
