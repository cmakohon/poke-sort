appId: com.cmakohon.pokesort
productName: PokeSort
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# The asar only ever contains the tiny main/preload bundle — the server and its
# native modules ship as extraResources, which are already outside the archive.
# Kept anyway as a guard: if a native dep ever ends up in the asar it will fail
# at load time with a confusing error, because WASM blobs and .node binaries
# cannot be read from inside an asar.
asarUnpack:
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@electric-sql/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"

extraResources:
  # Built by `pnpm run bundle:server`, which runs `pnpm deploy` with
  # node-linker=hoisted.
  #
  # A plain copy of packages/server/node_modules does NOT work: pnpm's tree is
  # symlinks into the workspace-root store, and electron-builder copies them as
  # symlinks — so the packaged app points at paths that do not exist on a user's
  # machine. `pnpm deploy` rewrites them to resolve within the bundle, and
  # `hoisted` flattens the result so there are no links left to mis-copy at all.
  - from: .server-bundle/dist
    to: server
  - from: .server-bundle/node_modules
    to: server/node_modules
  # The built SPA, served by that server over http://127.0.0.1.
  - from: ../web/dist
    to: web
  # Read from disk at runtime by the drizzle migrator.
  - from: ../../drizzle
    to: drizzle
  # SigLIP weights — see scripts/fetch-model.mjs. ~100 MB, deliberately shipped
  # rather than downloaded: offline operation is the whole point of the app.
  - from: ../../.models
    to: models
  # The Apple Vision OCR sidecar, built by the server's scripts/build-vision.mjs
  # during bundle:server. A ~100 KB Swift binary that must stay OUTSIDE the asar
  # because it has to be exec'd; adhoc-sign.mjs finds it by Mach-O magic and
  # signs it with everything else.
  #
  # The DIRECTORY, not the binary, and that is the whole point: the binary only
  # exists on macOS, and a `from` that does not exist fails the build with an
  # opaque copyFiles error (the same trap the .models check above guards). The
  # directory always exists because the .swift source is tracked, so Windows and
  # Linux copy a 4 KB source file, find no sidecar, and fall back to
  # tesseract.js — which is exactly what they should do.
  - from: ../server/native
    to: vision

# Ad-hoc signs the macOS bundle. Runs on every platform; no-ops off darwin.
# afterPack rather than afterSign — see the script for why both halves of that
# choice matter.
afterPack: ./scripts/adhoc-sign.mjs

mac:
  category: public.app-category.utilities
  target:
    - dmg
  # macOS wants the artwork inset in a transparent margin; Windows and Linux
  # want it edge to edge. Both are generated by `pnpm icons`.
  icon: build/icon-mac.png
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # There is no Developer ID for this project, so electron-builder would shell
  # out to `security find-identity`, find nothing, and print a certificate-hunt
  # error that reads like a build failure. This skips that search deliberately;
  # afterPack does the ad-hoc signing instead. Delete this line the day a real
  # certificate exists — electron-builder's own signing is strictly better.
  identity: null
  notarize: false
  extendInfo:
    # Required for getUserMedia — the scanner is a webcam app.
    NSCameraUsageDescription: PokeSort uses your camera to scan trading cards.

win:
  target:
    - nsis
  icon: build/icon.png
  # The NSIS default is "PokeSort Setup 1.0.1.exe"; GitHub rewrites the spaces
  # in an asset name and URL-encodes them in the download link.
  artifactName: ${productName}-${version}-win-${arch}.${ext}

linux:
  category: Utility
  target:
    - AppImage
  icon: build/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
